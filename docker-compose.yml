services:
  bot:
    build: .
    container_name: telegram-scheduler
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      # Comma-separated Telegram user IDs allowed to use the bot.
      # Leave unset only for testing - the bot is otherwise open to everyone.
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      # Optional: chat that receives unexpected-error reports
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      # Per-user media storage quota in MB (0 = unlimited)
      MAX_USER_STORAGE_MB: ${MAX_USER_STORAGE_MB:-2048}
      # Web board: leave WEB_BASE_URL empty to keep it off. Needs ALLOWED_USER_IDS.
      WEB_BASE_URL: ${WEB_BASE_URL:-}
      WEB_PORT: ${WEB_PORT:-8080}
    ports:
      # Loopback only: put a tunnel or reverse proxy (HTTPS) in front of it
      - "127.0.0.1:${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - ./data:/data
