name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install "python-telegram-bot==20.8" "apscheduler>=3.11.0" \
                      "pytz>=2025.2" "pillow>=11.3.0" pytest

      - name: Compile check
        run: python -m compileall -q main.py config.py bot/

      - name: Run tests
        run: pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t telegram-scheduler:ci .
