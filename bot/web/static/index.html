<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The server sends Referrer-Policy: no-referrer, under which a browser may send
     "Origin: null" on POST/PATCH/DELETE; the board's Origin check refuses that. -->
<meta name="referrer" content="same-origin">
<meta name="color-scheme" content="light dark">
<title>Post board</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h3M8 17h6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 15.7"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8.3"/><path d="M21 3v5.3h-5.3M3 21v-5.3h5.3"/></symbol>
  <symbol id="i-signout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></symbol>
  <symbol id="i-view" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-delete" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><path d="m22 8-6 4 6 4Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4Z"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></symbol>
  <symbol id="i-album" viewBox="0 0 24 24"><rect x="7" y="7" width="14" height="14" rx="2"/><path d="M3 15V5a2 2 0 0 1 2-2h10"/><path d="m21 17-3.5-3.5L11 20"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
</svg>

<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="icon brand-icon" aria-hidden="true" focusable="false"><use href="#i-board"/></svg>
        <h1 class="brand-name">Post board</h1>
        <span class="tz-note">Kyiv time</span>
      </div>
      <div class="filters">
        <label class="visually-hidden" for="channel-filter">Channel</label>
        <select id="channel-filter" class="field" disabled>
          <option value="">All channels</option>
        </select>
        <div class="search-field">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"/></svg>
          <label class="visually-hidden" for="search">Search captions</label>
          <input id="search" class="field" type="search" placeholder="Search captions" maxlength="200" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="actions">
        <button id="refresh" class="icon-button" type="button" aria-label="Refresh" title="Refresh">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-refresh"/></svg>
        </button>
        <button id="signout" class="button button-quiet" type="button" aria-label="Sign out">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-signout"/></svg>
          <span class="button-label">Sign out</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="tabs" aria-label="Post lists">
    <div class="tabs-inner" role="tablist">
      <button id="tab-scheduled" class="tab" type="button" role="tab" data-tab="scheduled" aria-controls="post-list" aria-selected="true"><span class="tab-label">Scheduled</span> <span class="count">–</span></button>
      <button id="tab-queued" class="tab" type="button" role="tab" data-tab="queued" aria-controls="post-list" aria-selected="false" tabindex="-1"><span class="tab-label">Queued</span> <span class="count">–</span></button>
      <button id="tab-failed" class="tab" type="button" role="tab" data-tab="failed" aria-controls="post-list" aria-selected="false" tabindex="-1"><span class="tab-label">Failed</span> <span class="count">–</span></button>
      <button id="tab-posted" class="tab" type="button" role="tab" data-tab="posted" aria-controls="post-list" aria-selected="false" tabindex="-1"><span class="tab-label">Posted</span> <span class="count">–</span></button>
    </div>
  </nav>

  <main class="board">
    <div id="post-list" role="tabpanel" aria-labelledby="tab-scheduled" aria-busy="true"></div>
    <p id="empty-state" hidden>Nothing here yet.</p>
    <p id="list-status" aria-live="polite"></p>
    <div id="list-sentinel" aria-hidden="true"></div>
  </main>

  <div class="dock">
    <div id="banner" class="banner" role="alert" hidden>
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-alert"/></svg>
      <span id="banner-text" class="banner-text"></span>
      <button id="banner-retry" class="button" type="button">Retry</button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
</div>

<section id="signed-out" class="message-card" hidden>
  <h1>You are not signed in</h1>
  <p>To open the post board, send <code>/web</code> to the bot in Telegram and open the link it replies with.</p>
  <p>The link works once and expires after 5 minutes.</p>
</section>
</body>
</html>
